# Gewichte und Dichten für die Nährwertberechnung (ADR 0004, plan/06-phase-4-import-naehrwerte.md, 4.6).
# Eigene Richtwerte, keine Messwerte und keine Übernahme aus anderen Datenbanken. Lizenz: CC BY-SA 4.0.
# Gewichte in Gramm, bezogen auf den essbaren Anteil (wie die BLS-Werte je 100 g).
#
# einheiten: gelten für alle Artikel ohne eigenen Wert. ml wird mit der Dichte des Artikels
#            (Standard 1 g/ml) in Gramm umgerechnet.
# artikel:   eigene Werte je Artikel. Schlüssel wie in den Rezepten, klein und ohne Umlaute:
